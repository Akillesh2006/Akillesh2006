<svg width="800" height="130" viewBox="0 0 800 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70A5FD"/>
      <stop offset="100%" stop-color="#38BDAE"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="796" height="126" rx="10" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>

  <!-- Step 1: Client Upload -->
  <g transform="translate(20, 25)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="url(#boxGrad1)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#70A5FD">STEP 01</text>
    <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C9D1D9">Resume Upload</text>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8B949E">Multipart PDF API</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 168 65 L 196 65" stroke="url(#lineGrad1)" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="196,61 204,65 196,69" fill="#38BDAE"/>

  <!-- Step 2: Apache PDFBox Engine -->
  <g transform="translate(210, 25)">
    <rect x="0" y="0" width="155" height="80" rx="8" fill="url(#boxGrad1)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDAE">STEP 02</text>
    <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C9D1D9">Apache PDFBox</text>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8B949E">Text Extraction Engine</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 373 65 L 401 65" stroke="url(#lineGrad1)" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="401,61 409,65 401,69" fill="#38BDAE"/>

  <!-- Step 3: Spring Security & JWT -->
  <g transform="translate(415, 25)">
    <rect x="0" y="0" width="165" height="80" rx="8" fill="url(#boxGrad1)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#BF91F3">STEP 03</text>
    <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C9D1D9">Spring Security</text>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8B949E">Stateless JWT Filter</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 588 65 L 616 65" stroke="url(#lineGrad1)" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="616,61 624,65 616,69" fill="#38BDAE"/>

  <!-- Step 4: JPA & MySQL Database -->
  <g transform="translate(630, 25)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="url(#boxGrad1)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F7D070">STEP 04</text>
    <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C9D1D9">Spring Data JPA</text>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8B949E">MySQL Relational Store</text>
  </g>
</svg>
