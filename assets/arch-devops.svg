<svg width="800" height="130" viewBox="0 0 800 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF91F3"/>
      <stop offset="100%" stop-color="#70A5FD"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="796" height="126" rx="10" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>

  <!-- Step 1: Express REST Gateway -->
  <g transform="translate(20, 25)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="url(#boxGrad2)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#BF91F3">GATEWAY</text>
    <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C9D1D9">Express.js REST</text>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8B949E">Rate-Limiter &amp; Joi</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 168 65 L 196 65" stroke="url(#lineGrad2)" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="196,61 204,65 196,69" fill="#70A5FD"/>

  <!-- Step 2: Multi-Tenant RBAC Security -->
  <g transform="translate(210, 25)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="url(#boxGrad2)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#70A5FD">SECURITY</text>
    <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C9D1D9">Multi-Tenant RBAC</text>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8B949E">JWT Refresh Rotation</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 378 65 L 406 65" stroke="url(#lineGrad2)" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="406,61 414,65 406,69" fill="#70A5FD"/>

  <!-- Step 3: Audit Logging Engine -->
  <g transform="translate(420, 25)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="url(#boxGrad2)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDAE">AUDIT LOG</text>
    <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C9D1D9">Audit Service</text>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8B949E">Immutable Audit Trail</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 588 65 L 616 65" stroke="url(#lineGrad2)" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="616,61 624,65 616,69" fill="#70A5FD"/>

  <!-- Step 4: MongoDB Scoped Store -->
  <g transform="translate(630, 25)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="url(#boxGrad2)" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F7D070">PERSISTENCE</text>
    <text x="16" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C9D1D9">MongoDB Store</text>
    <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8B949E">Soft-Delete Queries</text>
  </g>
</svg>
