<svg width="410" height="185" viewBox="0 0 410 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradStats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <linearGradient id="glowGradStats" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70A5FD"/>
      <stop offset="50%" stop-color="#BF91F3"/>
      <stop offset="100%" stop-color="#38BDAE"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70A5FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#70A5FD" stop-opacity="1"/>
      <stop offset="100%" stop-color="#BF91F3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="406" height="181" rx="12" fill="url(#bgGradStats)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Moving Light Beam along top border -->
  <rect x="0" y="2" width="120" height="2" fill="url(#beamGrad)">
    <animateTransform attributeName="transform" type="translate" from="-120,0" to="410,0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Header -->
  <g transform="translate(20, 24)">
    <circle cx="8" cy="8" r="6" fill="#70A5FD">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#70A5FD">PROBLEM SOLVING &amp; STATS</text>
  </g>

  <line x1="20" y1="46" x2="390" y2="46" stroke="#21262D" stroke-width="1"/>

  <!-- Stat 1: LeetCode -->
  <g transform="translate(20, 68)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#C9D1D9">LeetCode Solved</text>
    <text x="140" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#38BDAE">402</text>
    <text x="180" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8B949E">(E: 206 | M: 189 | H: 7)</text>

    <!-- Animated Progress Bar -->
    <rect x="0" y="8" width="370" height="6" rx="3" fill="#21262D"/>
    <rect x="0" y="8" width="280" height="6" rx="3" fill="url(#glowGradStats)">
      <animate attributeName="width" values="0;280" dur="1.5s" fill="freeze" />
    </rect>
  </g>

  <!-- Stat 2: SkillRack -->
  <g transform="translate(20, 110)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#C9D1D9">SkillRack Solved</text>
    <text x="140" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#BF91F3">119</text>
    <text x="180" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8B949E">(C: 83 | Py: 28 | C++: 7 | J: 1)</text>

    <!-- Animated Progress Bar -->
    <rect x="0" y="8" width="370" height="6" rx="3" fill="#21262D"/>
    <rect x="0" y="8" width="190" height="6" rx="3" fill="#BF91F3">
      <animate attributeName="width" values="0;190" dur="1.5s" fill="freeze" />
    </rect>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(20, 155)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8B949E">Academic CGPA: <tspan fill="#C9D1D9" font-weight="700">8.04 / 10</tspan></text>
    <text x="210" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8B949E">Internships: <tspan fill="#70A5FD" font-weight="600">Google, Tiranex, Alfido</tspan></text>
  </g>
</svg>
