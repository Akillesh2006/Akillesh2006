    <text x="16" y="28" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="700" fill="#BF91F3">BACKEND &amp; SECURITY</text>
    <line x1="16" y1="36" x2="179" y2="36" stroke="#21262D" stroke-width="1"/>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• Spring Boot 3.5.4</text>
    <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• Node.js / Express.js</text>
    <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• Spring Security &amp; JWT</text>
    <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• Multi-Tenant RBAC Auth</text>
    <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8B949E">• JPA / Hibernate / Joi</text>
  </g>

