    <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• Apache PDFBox Parsing</text>
    <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• React 19 / Tailwind v4</text>
    <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8B949E">• Framer Motion &amp; Graph 2D</text>
  </g>

  <!-- Column 4: Databases & DevOps -->
  <g transform="translate(640, 20)">
