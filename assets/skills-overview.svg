  </defs>

  <rect x="2" y="2" width="846" height="186" rx="12" fill="url(#bgGrad2)" stroke="url(#borderGrad2)" stroke-width="1.5"/>

  <!-- Column 1: Languages & Core -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="190" height="150" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="700" fill="#70A5FD">LANGUAGES &amp; CORE</text>
    <line x1="16" y1="36" x2="174" y2="36" stroke="#21262D" stroke-width="1"/>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• Java 21 (JDK 21)</text>
    <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• Kotlin (Android SDK)</text>
    <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• JavaScript (ES6+) / TS</text>
    <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#C9D1D9">• Python / C / C++</text>
    <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8B949E">• Data Structures &amp; DSA</text>
  </g>

