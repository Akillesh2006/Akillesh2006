<svg width="850" height="300" viewBox="0 0 850 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradUnique" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080E"/>
      <stop offset="50%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#101726"/>
    </linearGradient>

    <!-- Bespoke Name Gradient -->
    <linearGradient id="nameGradUnique" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70A5FD">
        <animate attributeName="stop-color" values="#70A5FD;#38BDAE;#BF91F3;#70A5FD" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#BF91F3">
        <animate attributeName="stop-color" values="#BF91F3;#70A5FD;#38BDAE;#BF91F3" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDAE">
        <animate attributeName="stop-color" values="#38BDAE;#BF91F3;#70A5FD;#38BDAE" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Moving Laser Scanner -->
    <linearGradient id="laserScan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70A5FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDAE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#BF91F3" stop-opacity="0"/>
    </linearGradient>

    <!-- Faint Tech Grid -->
    <pattern id="gridUnique" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#70A5FD" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect x="2" y="2" width="846" height="296" rx="16" fill="url(#bgGradUnique)" stroke="#1F293D" stroke-width="1.5"/>
  <rect x="4" y="4" width="842" height="292" rx="14" fill="url(#gridUnique)"/>

  <!-- Cyberpunk Corner Brackets -->
  <path d="M 14 4 L 42 4 L 42 6 L 16 6 L 16 32 L 14 32 Z" fill="#70A5FD"/>
  <path d="M 836 4 L 808 4 L 808 6 L 834 6 L 834 32 L 836 32 Z" fill="#70A5FD"/>
  <path d="M 14 296 L 42 296 L 42 294 L 16 294 L 16 268 L 14 268 Z" fill="#38BDAE"/>
  <path d="M 836 296 L 808 296 L 808 294 L 834 294 L 834 268 L 836 268 Z" fill="#38BDAE"/>

  <!-- Top Laser Beam -->
  <rect x="0" y="2" width="220" height="2" fill="url(#laserScan)">
    <animateTransform attributeName="transform" type="translate" from="-220,0" to="850,0" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD Top Bar -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="8" height="8" fill="#38BDAE"/>
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDAE" letter-spacing="1.2">SYSTEM COMMAND CENTER // AKILLESH_OS v4.2 • CHENNAI, IN</text>
  </g>

  <!-- Main Left Accent Bar -->
  <rect x="36" y="52" width="4" height="188" rx="2" fill="url(#nameGradUnique)"/>

  <!-- Header Title -->
  <text x="56" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="url(#nameGradUnique)" letter-spacing="1">AKILLESH K P</text>

  <!-- Subtitle -->
  <text x="56" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#C9D1D9">Software Engineer · Backend Architecture &amp; AI Systems</text>

  <!-- Integrated Metrics Tiles (Inside SVG!) -->
  <!-- Tile 1: LeetCode -->
  <g transform="translate(56, 142)">
    <rect x="0" y="0" width="170" height="48" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8B949E">LEETCODE SOLVED</text>
    <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#38BDAE">402 <tspan font-size="11" font-weight="500" fill="#8B949E">(206E / 189M / 7H)</tspan></text>
  </g>

  <!-- Tile 2: SkillRack -->
  <g transform="translate(238, 142)">
    <rect x="0" y="0" width="170" height="48" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8B949E">SKILLRACK SOLVED</text>
    <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#BF91F3">119 <tspan font-size="11" font-weight="500" fill="#8B949E">(C / Py / C++ / J)</tspan></text>
  </g>

  <!-- Tile 3: Education & CGPA -->
  <g transform="translate(420, 142)">
    <rect x="0" y="0" width="180" height="48" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8B949E">B.E. CSE @ CIT CHENNAI</text>
    <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#70A5FD">CGPA 8.04 <tspan font-size="11" font-weight="500" fill="#8B949E">('24–'28)</tspan></text>
  </g>

  <!-- Tile 4: Internships -->
  <g transform="translate(612, 142)">
    <rect x="0" y="0" width="180" height="48" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8B949E">EXPERIENCE HIGHLIGHT</text>
    <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#C9D1D9">Google Alum · Tiranex</text>
  </g>

  <!-- Interactive Target Radar HUD (Right Side) -->
  <g transform="translate(740, 75)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#70A5FD" stroke-width="1" stroke-dasharray="5 3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#BF91F3" stroke-width="1" opacity="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#38BDAE" filter="url(#glowEffect)"/>
    <line x1="-38" y1="0" x2="38" y2="0" stroke="#70A5FD" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#70A5FD" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Separator Line -->
  <path d="M 56 206 L 792 206" stroke="#21262D" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Live Status & Stack Bar -->
  <g transform="translate(56, 228)">
    <circle cx="6" cy="-4" r="4" fill="#38BDAE">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;6.5;4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8B949E">CORE STACK: <tspan fill="#70A5FD">Spring Boot 3.5</tspan> · <tspan fill="#BF91F3">Java 21</tspan> · <tspan fill="#38BDAE">Android/Kotlin</tspan> · <tspan fill="#F7D070">Next.js 16</tspan> · <tspan fill="#70A5FD">Gemini AI</tspan> · <tspan fill="#BF91F3">Node/MongoDB</tspan></text>
  </g>
</svg>
