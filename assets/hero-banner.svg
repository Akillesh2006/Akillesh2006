<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70A5FD"/>
      <stop offset="50%" stop-color="#BF91F3"/>
      <stop offset="100%" stop-color="#38BDAE"/>
    </linearGradient>

    <!-- Glow Accent -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Card Subtle Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="50%" stop-color="#70A5FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#30363D"/>
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="846" height="236" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Glow Blob -->
  <circle cx="750" cy="50" r="100" fill="#70A5FD" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="200" r="80" fill="#BF91F3" opacity="0.06" filter="url(#glow)"/>

  <!-- Decorative Grid Pattern (Right Side) -->
  <g opacity="0.12" fill="#C9D1D9">
    <circle cx="700" cy="40" r="2"/><circle cx="720" cy="40" r="2"/><circle cx="740" cy="40" r="2"/><circle cx="760" cy="40" r="2"/><circle cx="780" cy="40" r="2"/><circle cx="800" cy="40" r="2"/>
    <circle cx="700" cy="60" r="2"/><circle cx="720" cy="60" r="2"/><circle cx="740" cy="60" r="2"/><circle cx="760" cy="60" r="2"/><circle cx="780" cy="60" r="2"/><circle cx="800" cy="60" r="2"/>
    <circle cx="700" cy="80" r="2"/><circle cx="720" cy="80" r="2"/><circle cx="740" cy="80" r="2"/><circle cx="760" cy="80" r="2"/><circle cx="780" cy="80" r="2"/><circle cx="800" cy="80" r="2"/>
    <circle cx="700" cy="100" r="2"/><circle cx="720" cy="100" r="2"/><circle cx="740" cy="100" r="2"/><circle cx="760" cy="100" r="2"/><circle cx="780" cy="100" r="2"/><circle cx="800" cy="100" r="2"/>
  </g>

  <!-- Left Accent Pulse Line -->
  <rect x="36" y="42" width="4" height="156" rx="2" fill="url(#nameGrad)"/>

  <!-- Header Title -->
  <text x="56" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#nameGrad)" letter-spacing="0.5">AKILLESH K P</text>

  <!-- Tagline / Subtitle -->
  <text x="56" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#C9D1D9">Software Engineer · Backend Systems &amp; Mobile Developer</text>

  <!-- Micro Pills Container -->
  <!-- Pill 1: Education -->
  <g transform="translate(56, 134)">
    <rect x="0" y="0" width="310" height="28" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#38BDAE"/>
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8B949E">B.E. CSE @ CIT <tspan fill="#C9D1D9">(2024–2028 | CGPA 8.04)</tspan></text>
  </g>

  <!-- Pill 2: Core Stack -->
  <g transform="translate(378, 134)">
    <rect x="0" y="0" width="220" height="28" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#70A5FD"/>
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8B949E">Java 21 · Spring Boot · Android</text>
  </g>

  <!-- Pill 3: Internship Highlight -->
  <g transform="translate(610, 134)">
    <rect x="0" y="0" width="185" height="28" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#BF91F3"/>
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8B949E">Google Internship Alum</text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 56 186 L 795 186" stroke="#21262D" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Status Line -->
  <g transform="translate(56, 204)">
    <circle cx="6" cy="-4" r="4" fill="#38BDAE">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8B949E">Currently Building: <tspan fill="#70A5FD" font-weight="600">SkillBridge AI Career Platform</tspan></text>
  </g>
</svg>
