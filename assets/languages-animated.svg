<svg width="410" height="185" viewBox="0 0 410 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradLangs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <linearGradient id="beamGradLangs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF91F3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BF91F3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDAE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="406" height="181" rx="12" fill="url(#bgGradLangs)" stroke="#30363D" stroke-width="1.5"/>

  <!-- Moving Light Beam -->
  <rect x="0" y="2" width="120" height="2" fill="url(#beamGradLangs)">
    <animateTransform attributeName="transform" type="translate" from="-120,0" to="410,0" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Header -->
  <g transform="translate(20, 24)">
    <circle cx="8" cy="8" r="6" fill="#BF91F3">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#BF91F3">CORE STACK BREAKDOWN</text>
  </g>

  <line x1="20" y1="46" x2="390" y2="46" stroke="#21262D" stroke-width="1"/>

  <!-- Bar 1: Java & Spring Boot -->
  <g transform="translate(20, 64)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">Java &amp; Spring Boot</text>
    <text x="340" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#70A5FD">35%</text>
    <rect x="0" y="6" width="370" height="5" rx="2.5" fill="#21262D"/>
    <rect x="0" y="6" width="130" height="5" rx="2.5" fill="#70A5FD">
      <animate attributeName="width" values="0;130" dur="1.2s" fill="freeze" />
    </rect>
  </g>

  <!-- Bar 2: Kotlin & Android -->
  <g transform="translate(20, 92)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">Kotlin &amp; Android SDK</text>
    <text x="340" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#BF91F3">25%</text>
    <rect x="0" y="6" width="370" height="5" rx="2.5" fill="#21262D"/>
    <rect x="0" y="6" width="92" height="5" rx="2.5" fill="#BF91F3">
      <animate attributeName="width" values="0;92" dur="1.2s" fill="freeze" />
    </rect>
  </g>

  <!-- Bar 3: Next.js & TypeScript -->
  <g transform="translate(20, 120)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">Next.js &amp; TypeScript</text>
    <text x="340" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDAE">20%</text>
    <rect x="0" y="6" width="370" height="5" rx="2.5" fill="#21262D"/>
    <rect x="0" y="6" width="74" height="5" rx="2.5" fill="#38BDAE">
      <animate attributeName="width" values="0;74" dur="1.2s" fill="freeze" />
    </rect>
  </g>

  <!-- Bar 4: Python & AI APIs -->
  <g transform="translate(20, 148)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#C9D1D9">Python &amp; Gemini AI</text>
    <text x="340" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F7D070">20%</text>
    <rect x="0" y="6" width="370" height="5" rx="2.5" fill="#21262D"/>
    <rect x="0" y="6" width="74" height="5" rx="2.5" fill="#F7D070">
      <animate attributeName="width" values="0;74" dur="1.2s" fill="freeze" />
    </rect>
  </g>
</svg>
